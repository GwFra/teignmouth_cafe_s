name: Deploy to Vercel

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to deploy"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0 # needs the previous release tag to diff .env.example

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # drizzle-kit (a dev dependency) runs the migrations below.
      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Runs before `vercel pull` so the build sees the new variables. Values
      # come from repository secrets/variables named after each variable.
      - name: Add new environment variables to Vercel
        env:
          TAG: ${{ inputs.tag }}
          GH_SECRETS: ${{ toJSON(secrets) }}
          GH_VARS: ${{ toJSON(vars) }}
        run: |
          BASE=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          node scripts/env-vars.mjs sync --base "$BASE"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # A copy of production as it was before this release's migrations, to
      # restore from if one goes wrong (see README → Deploying). It has no
      # compute, so costs nothing while unused, and expires after 14 days.
      - name: Create Neon rollback branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PRODUCTION_BRANCH: ${{ vars.NEON_PRODUCTION_BRANCH }}
          TAG: ${{ inputs.tag }}
        run: |
          NAME="pre-$TAG-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npx --yes neonctl@8.16.0 branches create \
            --project-id "$NEON_PROJECT_ID" \
            --parent "$NEON_PRODUCTION_BRANCH" \
            --name "$NAME" \
            --no-compute \
            --no-secrets \
            --expires-at "$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)"
          echo "Rollback branch: \`$NAME\` (expires in 14 days)" >> "$GITHUB_STEP_SUMMARY"

      # Runs before Deploy so a failed migration stops the release while the
      # previous version keeps serving. Drops and renames therefore need to
      # ship a release after the code stops using what they remove.
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run db:baseline
          npm run db:migrate

      - name: Deploy
        id: deploy
        env:
          TAG: ${{ inputs.tag }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --meta version="$TAG")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed \`$TAG\` to production: $URL" >> "$GITHUB_STEP_SUMMARY"
