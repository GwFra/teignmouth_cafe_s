name: Deploy to Vercel

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to deploy"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0 # needs the previous release tag to diff .env.example

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Runs before `vercel pull` so the build sees the new variables. Values
      # come from repository secrets/variables named after each variable.
      - name: Add new environment variables to Vercel
        env:
          TAG: ${{ inputs.tag }}
          GH_SECRETS: ${{ toJSON(secrets) }}
          GH_VARS: ${{ toJSON(vars) }}
        run: |
          BASE=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          node scripts/env-vars.mjs sync --base "$BASE"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        env:
          TAG: ${{ inputs.tag }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --meta version="$TAG")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed \`$TAG\` to production: $URL" >> "$GITHUB_STEP_SUMMARY"
