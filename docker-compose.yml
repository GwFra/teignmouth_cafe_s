# Local stand-in for Neon: plain Postgres plus a proxy that speaks Neon's
# HTTP query protocol, so the app's @neondatabase/serverless driver works
# unchanged. Point DATABASE_URL at it with:
#
#   DATABASE_URL="postgres://postgres:postgres@db.localtest.me:5432/main"
#
# (db.localtest.me is public DNS for 127.0.0.1; src/lib/db/index.ts routes
# that host to the proxy.)
#
# On first start, with an empty volume, Postgres runs docker/db/init.sh,
# which applies the Drizzle migrations and seeds sample data. Later starts
# keep whatever is in the volume. `npm run db:reset` wipes it and re-seeds.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./drizzle:/migrations:ro
      - ./docker/db/seed.sql:/seed/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 2s
      timeout: 5s
      retries: 15

  neon-proxy:
    # Community-maintained proxy recommended in Neon's and Drizzle's docs for
    # local development with the serverless driver.
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
